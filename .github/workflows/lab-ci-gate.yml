name: Lab Release & Security Gate

on:
  pull_request:
    branches:
      - main
      - "review/lab-**"
  push:
    branches:
      - "review/lab-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-static-gate:
    name: Static Build, Security Headers, Secrets & Supply-Chain Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (deterministic lockfile)
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Supply-chain high audit & versioned exceptions gate
        run: |
          node scripts/verify-audit-exceptions.mjs
          node scripts/generate-license-report.mjs

      - name: Brand compliance check
        run: npm run test:brand

      - name: Build static site (Fail-Closed unconfigured sandbox baseline)
        env:
          PUBLIC_LAB_SANDBOX_ORIGIN: ""
        run: npm run build

      - name: Run 10-point Lab release & zero-function sandbox dry-run gate
        run: npm run test:lab:gate

      - name: Upload License & Security reports artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: license-and-security-reports
          path: |
            security/licenses.json
            security/LICENSES.md
            security/npm-audit-exceptions.json

  cross-browser-matrix:
    name: Playwright Lab E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.browser }} browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build static site
        env:
          PUBLIC_LAB_SANDBOX_ORIGIN: ""
        run: npm run build

      - name: Run Lab security & cross-origin simulation suite (${{ matrix.browser }})
        env:
          TARGET_BROWSER: ${{ matrix.browser }}
        run: npm run test:lab:browsers
