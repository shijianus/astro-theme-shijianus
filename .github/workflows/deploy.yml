name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install, build, and upload
        uses: withastro/action@15aa0a5a1e067940253e3b259413ab2ae882a740 # v5.2.0
        with:
          node-version: 22
          build-cmd: npm run build:static
        env:
          SITE_URL: https://shijian.us
          SITE_BASE: /
          PUBLIC_STATIC_EXPORT: 1
          PUBLIC_RUNTIME_API_BASE: https://shijianus-blog.pages.dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
