name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install, build, and upload
        uses: withastro/action@v5
        with:
          node-version: 24
          build-cmd: npm run build:static
        env:
          SITE_URL: https://shijian.us
          SITE_BASE: /
          PUBLIC_STATIC_EXPORT: 1
          PUBLIC_RUNTIME_API_BASE: https://shijianus-blog.pages.dev

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
