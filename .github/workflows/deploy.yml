name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub Pages availability
        id: check_pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "GitHub Pages API status for ${{ github.repository }}: ${status}"
          if [ "${status}" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${status}" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository }}" = "shijianus/shijianus.github.io" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install, build, and upload
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24
          build-cmd: npm run build:static
        env:
          SITE_URL: https://shijian.us
          SITE_BASE: /
          PUBLIC_STATIC_EXPORT: 1
          PUBLIC_RUNTIME_API_BASE: https://shijianus-blog.pages.dev
          PUBLIC_LAB_SANDBOX_ORIGIN: https://epocanvas-lab-sandbox.pages.dev

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
