name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: shijianus-blog-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: shijianus-blog-v2
      - name: Build Astro
        run: npm run build
        working-directory: shijianus-blog-v2
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: shijianus-blog-v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
