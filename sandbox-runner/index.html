<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; frame-src 'self' blob:; child-src 'self' blob:; worker-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>EpoCanvas Lab · Cross-Site Isolated Sandbox Receiver</title>
  <style>
    html, body, #frame-mount, iframe {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="frame-mount">
    <iframe
      id="inner-runner"
      sandbox="allow-scripts"
      referrerpolicy="no-referrer"
      title="Inner Opaque Execution Frame"
    ></iframe>
  </div>
  <script>
    (function () {
      var PROTOCOL = 'LAB_SANDBOX_PROTOCOL_V1';
      var MAX_SRCDOC_CHARS = 384 * 1024;
      var MAX_FORWARDED_MESSAGES = 360;

      var activeHostOrigin = null;
      var activeSessionId = null;
      var forwardedCount = 0;
      var mountEl = document.getElementById('frame-mount');
      var innerFrame = document.getElementById('inner-runner');

      function isAllowedHostOrigin(origin) {
        if (typeof origin !== 'string' || !origin) return false;
        if (window.location.protocol === 'https:') {
          return origin === 'https://blog.epocanvas.com';
        }
        // 仅当桥接器本身运行于本地 HTTP 回环地址时允许本地开发/多 Origin 验收端口
        var hostName = window.location.hostname;
        if (window.location.protocol === 'http:' && (hostName === 'localhost' || hostName === '127.0.0.1')) {
          return /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(origin) && origin !== window.location.origin;
        }
        return false;
      }

      function recreateInnerFrame(nextSrcDoc) {
        if (!mountEl) return;
        if (innerFrame && innerFrame.parentNode) {
          innerFrame.parentNode.removeChild(innerFrame);
        }
        var fresh = document.createElement('iframe');
        fresh.id = 'inner-runner';
        fresh.setAttribute('sandbox', 'allow-scripts');
        fresh.setAttribute('referrerpolicy', 'no-referrer');
        fresh.setAttribute('title', 'Inner Opaque Execution Frame');
        if (typeof nextSrcDoc === 'string' && nextSrcDoc.length > 0) {
          fresh.srcdoc = nextSrcDoc;
        }
        mountEl.appendChild(fresh);
        innerFrame = fresh;
      }

      window.addEventListener('message', function (event) {
        if (!event || !event.data || typeof event.data !== 'object') return;
        if (event.data.protocol !== PROTOCOL) return;

        // 1. 来自内部 Opaque Sandbox (`event.origin === "null"`) 的运行事件 -> 转发回已握手的受信任主站窗口
        if (innerFrame && event.source === innerFrame.contentWindow) {
          if (event.origin !== 'null') return;
          if (
            activeHostOrigin &&
            window.parent &&
            window.parent !== window &&
            activeSessionId &&
            event.data.sessionId === activeSessionId
          ) {
            if (forwardedCount >= MAX_FORWARDED_MESSAGES) return;
            forwardedCount++;
            window.parent.postMessage(event.data, activeHostOrigin);
          }
          return;
        }

        // 2. 来自外部父窗口的主站控制指令 -> 严格校验 `window.parent` 与 Origin 白名单
        if (event.source === window.parent && window.parent !== window && isAllowedHostOrigin(event.origin)) {
          var cmdType = event.data.type;
          var reqSessionId = typeof event.data.sessionId === 'string' ? event.data.sessionId.slice(0, 128) : '';
          if (!reqSessionId) return;

          activeHostOrigin = event.origin;

          if (cmdType === 'PING') {
            activeSessionId = reqSessionId;
            window.parent.postMessage(
              {
                protocol: PROTOCOL,
                sessionId: reqSessionId,
                type: 'SANDBOX_BRIDGE_READY',
                payload: {}
              },
              activeHostOrigin
            );
            return;
          }

          if (cmdType === 'TERMINATE_SESSION') {
            if (activeSessionId === reqSessionId) {
              activeSessionId = null;
              forwardedCount = 0;
              recreateInnerFrame('');
            }
            return;
          }

          if (cmdType === 'SET_THEME') {
            if (innerFrame && innerFrame.contentWindow && event.data.payload) {
              innerFrame.contentWindow.postMessage(
                {
                  protocol: PROTOCOL,
                  sessionId: activeSessionId || reqSessionId,
                  type: 'SET_THEME',
                  payload: { theme: event.data.payload.theme === 'dark' ? 'dark' : 'light' }
                },
                '*'
              );
            }
            return;
          }

          if (
            cmdType === 'EXECUTE_CODE' &&
            event.data.payload &&
            typeof event.data.payload.srcDoc === 'string' &&
            event.data.payload.srcDoc.length <= MAX_SRCDOC_CHARS
          ) {
            activeSessionId = reqSessionId;
            forwardedCount = 0;
            recreateInnerFrame(event.data.payload.srcDoc);
          }
        }
      });

      // 初次加载完成广播无状态就绪探针，便于父窗口消除加载竞态
      if (window.parent && window.parent !== window) {
        try {
          window.parent.postMessage(
            {
              protocol: PROTOCOL,
              sessionId: '__bridge_init__',
              type: 'SANDBOX_BRIDGE_READY',
              payload: {}
            },
            '*'
          );
        } catch (_err) {}
      }
    })();
  </script>
</body>
</html>
