<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; }
  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  .main { height: 2000px; background: #fee; }
  .aside { display: flex; flex-direction: column; background: #eef; }
  .aside-inner { position: relative; flex: 1; display: flex; flex-direction: column; }
  .aside-content { flex: 1; display: flex; flex-direction: column; border: 2px solid red; }
  .top-item { height: 200px; background: #ccf; }
  .sticky { position: sticky; top: 80px; height: 300px; background: #cfc; }
</style>
</head>
<body>
  <div class="grid">
    <div class="main">Main (2000px)</div>
    <div class="aside">
      <div class="aside-inner">
        <div class="aside-content">
          <div class="top-item">Top (200px)</div>
          <div class="sticky">Sticky (300px)</div>
        </div>
      </div>
    </div>
  </div>
  <div style="height: 1000px; background: #ddd;">Footer</div>
</body>
</html>
