<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="sonic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sonic-wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="sonic-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sonic-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#10b981" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#sonic-bg)" />
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Acoustic Circular Soundwaves -->
  <circle cx="60" cy="60" r="42" stroke="rgba(52, 211, 153, 0.15)" stroke-width="1.5" stroke-dasharray="8 4" />
  <circle cx="60" cy="60" r="32" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.2" />

  <!-- Headphone Audio Arch -->
  <g filter="url(#sonic-shadow)">
    <!-- Headphone Band -->
    <path d="M30 64 C30 42, 43 28, 60 28 C77 28, 90 42, 90 64" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <path d="M35 50 C40 38, 49 34, 60 34 C71 34, 80 38, 85 50" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Left Ear Cup -->
    <rect x="23" y="58" width="14" height="26" rx="7" fill="url(#sonic-glow)" />
    <rect x="28" y="63" width="4" height="16" rx="2" fill="#ffffff" />

    <!-- Right Ear Cup -->
    <rect x="83" y="58" width="14" height="26" rx="7" fill="url(#sonic-glow)" />
    <rect x="88" y="63" width="4" height="16" rx="2" fill="#ffffff" />

    <!-- Central Sound Equalizer Frequency Bars -->
    <g transform="translate(42, 60)">
      <!-- Bar 1 -->
      <line x1="4" y1="18" x2="4" y2="28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="4" y1="21" x2="4" y2="25" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

      <!-- Bar 2 -->
      <line x1="11" y1="12" x2="11" y2="34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="11" y1="16" x2="11" y2="30" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

      <!-- Bar 3 (Center High) -->
      <line x1="18" y1="6" x2="18" y2="40" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
      <line x1="18" y1="11" x2="18" y2="35" stroke="#a7f3d0" stroke-width="3.5" stroke-linecap="round" />

      <!-- Bar 4 -->
      <line x1="25" y1="10" x2="25" y2="36" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="25" y1="15" x2="25" y2="31" stroke="#34d399" stroke-width="3" stroke-linecap="round" />

      <!-- Bar 5 -->
      <line x1="32" y1="17" x2="32" y2="29" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
      <line x1="32" y1="20" x2="32" y2="26" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>
</svg>