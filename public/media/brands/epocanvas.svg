<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="epocanvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="35%" stop-color="#311042" />
      <stop offset="70%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="canvas-layer-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="canvas-layer-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="canvas-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="epocanvas-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#epocanvas-bg)" />
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Dynamic Creative Grid Background -->
  <circle cx="60" cy="60" r="40" stroke="rgba(192, 132, 252, 0.15)" stroke-width="1.2" stroke-dasharray="6 3" />
  <circle cx="60" cy="60" r="26" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1" />

  <!-- Layered Canvas Workshop Art -->
  <g filter="url(#epocanvas-shadow)">
    <!-- Back skewed canvas board -->
    <rect x="36" y="24" width="50" height="50" rx="10" transform="rotate(14 61 49)" fill="url(#canvas-layer-1)" opacity="0.8" />

    <!-- Front main canvas board -->
    <rect x="28" y="32" width="54" height="54" rx="12" fill="url(#canvas-layer-2)" />

    <!-- Internal artwork inside canvas: geometric era canvas lines & palette -->
    <path d="M38 68 C 44 52, 54 48, 68 54 C 74 58, 76 50, 78 44" fill="none" stroke="url(#canvas-accent)" stroke-width="4" stroke-linecap="round" />
    <circle cx="44" cy="50" r="4" fill="#a855f7" />
    <circle cx="58" cy="62" r="3.5" fill="#ec4899" />
    <circle cx="70" cy="46" r="4.5" fill="#6366f1" />

    <!-- Digital builder corner node -->
    <rect x="64" y="68" width="14" height="14" rx="4" fill="#7c3aed" />
    <path d="M68 75 L74 75 M71 72 L71 78" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Star sparkle accent -->
  <path d="M92 26 L94 32 L100 34 L94 36 L92 42 L90 36 L84 34 L90 32 Z" fill="#fde047" opacity="0.9" />
</svg>