<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="epomail-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="epomail-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="epomail-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="epomail-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#epomail-bg)" />
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Background decorative tech grid rings -->
  <circle cx="60" cy="60" r="42" stroke="rgba(56, 189, 248, 0.12)" stroke-width="1" stroke-dasharray="4 4" />
  <circle cx="60" cy="60" r="30" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1" />

  <!-- Envelope Main Body -->
  <g filter="url(#epomail-shadow)">
    <!-- Base envelope card -->
    <rect x="26" y="38" width="68" height="46" rx="8" fill="url(#epomail-card)" />

    <!-- Top Flap (folded) -->
    <path d="M26 44 L60 67 L94 44" fill="none" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M26 80 L50 58" stroke="rgba(2, 132, 199, 0.35)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M94 80 L70 58" stroke="rgba(2, 132, 199, 0.35)" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cyan Flap Shading -->
    <path d="M28 40 L60 63 L92 40 Z" fill="rgba(56, 189, 248, 0.2)" />
  </g>

  <!-- Encrypted Shield / Keyhole Badge (Lower Right) -->
  <g transform="translate(68, 62)">
    <circle cx="16" cy="16" r="16" fill="#0369a1" />
    <circle cx="16" cy="16" r="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Lock Glyph -->
    <rect x="10" y="14" width="12" height="10" rx="2.5" fill="#ffffff" />
    <path d="M12.5 14 V11 C12.5 9 14 7.5 16 7.5 C18 7.5 19.5 9 19.5 11 V14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="16" cy="18.5" r="1.5" fill="#0284c7" />
  </g>
</svg>