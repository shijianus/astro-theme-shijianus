<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; padding: 0; }
  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  .page-main { background: #fee; height: 2000px; }
  
  .page-aside { align-self: stretch; background: #eef; }
  .page-aside__sticky { position: relative; height: 100%; display: block; }
  #aside-content { width: 300px; height: 100%; display: grid; gap: 20px; align-content: start; border: 2px solid red; }
  
  .top-item { height: 200px; background: #ccf; }
  .sticky_layout { position: sticky; top: 80px; height: max-content; background: #cfc; }
  
  .card-feature-panel--overview { height: 300px; border: 1px solid black; }
</style>
</head>
<body>
  <div class="layout">
    <div class="page-main">Main (2000px)</div>
    <div class="page-aside">
      <div class="page-aside__sticky">
        <div id="aside-content">
          <div class="top-item">Top (200px)</div>
          <div class="sticky_layout sticky_layout--utility">
            <div class="card-feature-panel--overview">
              Sticky Card (300px)<br><br><br><br>End
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div style="height: 1000px; background: #ddd;">Footer</div>
</body>
</html>
